name: Docsentry
description: Verify repository documentation against checked-out local evidence.
inputs:
  config:
    description: Optional Docsentry configuration path, relative to the working directory.
    required: false
    default: ''
  format:
    description: Report format passed to docsentry check (terminal or json).
    required: false
    default: terminal
  working-directory:
    description: Repository directory to verify.
    required: false
    default: .
runs:
  using: composite
  steps:
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
    - name: Install Docsentry
      shell: bash
      run: |
        set -euo pipefail
        cd -- "$GITHUB_ACTION_PATH"
        npm ci --ignore-scripts
        npm run build --silent
    - name: Verify documentation
      shell: bash
      env:
        DOCSENTRY_CONFIG: ${{ inputs.config }}
        DOCSENTRY_FORMAT: ${{ inputs.format }}
        DOCSENTRY_WORKING_DIRECTORY: ${{ inputs.working-directory }}
        DOCSENTRY_CLI: ${{ github.action_path }}/dist/cli/index.js
      run: |
        set -euo pipefail
        cd -- "$DOCSENTRY_WORKING_DIRECTORY"
        if [[ -n "$DOCSENTRY_CONFIG" ]]; then
          node "$DOCSENTRY_CLI" check --config "$DOCSENTRY_CONFIG" --format "$DOCSENTRY_FORMAT"
        else
          node "$DOCSENTRY_CLI" check --format "$DOCSENTRY_FORMAT"
        fi
